[project]
name = "assistant-bias-reproduction"
version = "0.1.0"
description = "Minimal reproduction code for role-vector analysis of LLM user simulators"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasets>=4.0,<5",
  "numpy>=1.26,<3",
  "openai>=2.0,<3",
  "scipy>=1.14,<2",
  "torch>=2.7,<3",
  "transformer-lens==3.9.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
